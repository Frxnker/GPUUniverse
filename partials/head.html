  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Política de seguridad de contenido: scripts solo del propio sitio (y el de pre-pintado, por su hash,
       que calcula npm run shell); datos externos solo de rss2json; imágenes https para las noticias -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' {{scripthash}}; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.rss2json.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="theme-color" content="#050807" />
  <link rel="preload" href="{{root}}assets/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{root}}assets/fonts/exo-2-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{root}}css/style.css" />
  <link rel="icon" href="{{root}}assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{root}}assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="{{root}}manifest.webmanifest" />
  <!-- Tema, color de acento e idioma antes de pintar (evita destellos); solo acepta valores válidos -->
  <script>(function(d){try{var s=localStorage,t=s.getItem('gpu-universe-theme'),a=s.getItem('gpu-universe-accent'),l=s.getItem('gpu_lang');d.setAttribute('data-theme',t==='light'?'light':'dark');if(/^[a-z]{3,12}$/.test(a||''))d.setAttribute('data-accent',a);if(/^(es|en|fr|de|it|ru)$/.test(l||''))d.lang=l;}catch(e){d.setAttribute('data-theme','dark');}})(document.documentElement);</script>
